<div class="header">
    <emc-input-search id="search"></emc-input-search>
</div>
<emc-datagrid id="grid" stretched="name">
    <emc-datagrid-column name="name" caption="Key" type="string" width="200"></emc-datagrid-column>
    <emc-datagrid-column name="icon" caption="Icon" type="image" width="400" editable action="icon"></emc-datagrid-column>
    <emc-datagrid-column name="counting" caption="Counting" type="boolean" width="100" editable action="counting"></emc-datagrid-column>
    <emc-datagrid-column name="delete" caption="" type="button" width="100" text="Delete" action="delete"></emc-datagrid-column>
</emc-datagrid>
<emc-form-row class="footer" align="end">
    <emc-button id="add" text="Add entry" icon="+"></emc-button>
</emc-form-row>
