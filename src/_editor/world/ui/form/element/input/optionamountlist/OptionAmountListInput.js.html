<div id="container">
    <div id="header">
        <emc-input-search id="search"></emc-input-search>
    </div>
    <emc-datagrid id="grid" nohead stretched="name">
        <emc-datagrid-column name="name" label="Key" type="string" width="200"></emc-datagrid-column>
        <emc-datagrid-column name="value" label="Value" type="number" width="100" editable action="value"></emc-datagrid-column>
    </emc-datagrid>
    <emc-form-row id="footer" align="end">
    </emc-form-row>
    <slot id="options-container"></slot>
</div>
