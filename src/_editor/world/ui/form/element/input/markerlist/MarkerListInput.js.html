<div class="header">
    <emc-input-search id="search" nohover></emc-input-search>
</div>
<emc-datagrid id="grid" stretched="relation">
    <emc-datagrid-column name="sort" caption="" type="button-sorter"></emc-datagrid-column>
    <emc-datagrid-column name="relation" caption="Entity" type="relation"></emc-datagrid-column>
    <emc-datagrid-column name="pos" caption="Position" type="coordinates" width="150" editable action="pos"></emc-datagrid-column>
    <emc-datagrid-column name="visible" caption="Visible" type="boolorlogic" width="150" editable action="visible"></emc-datagrid-column>
    <emc-datagrid-column name="accessPenetration" caption="Access Penetration" type="boolorlogic" width="150" editable action="accessPenetration"></emc-datagrid-column>
    <emc-datagrid-column name="mapOnly" caption="Map Only" type="boolean" width="50" editable action="mapOnly"></emc-datagrid-column>
    <emc-datagrid-column name="rootOnly" caption="Root Only" type="boolean" width="50" editable action="rootOnly"></emc-datagrid-column>
    <emc-datagrid-column name="remove" caption="" type="button" width="100" text="Remove" action="remove"></emc-datagrid-column>
</emc-datagrid>
<emc-form-row class="footer" align="end">
    <emc-button id="add" text="Add entity" icon="+"></emc-button>
</emc-form-row>
