<div id="container">
    <div id="header">
        <emc-input-search id="search"></emc-input-search>
    </div>
    <emc-datagrid id="grid" stretched="name">
        <emc-datagrid-column name="name" label="Label" type="string" width="200"></emc-datagrid-column>
        <emc-datagrid-column name="posA" label="Position A" type="coordinates" width="300" editable action="posA" postfix="_posA"></emc-datagrid-column>
        <emc-datagrid-column name="posB" label="Position B" type="coordinates" width="300" editable action="posB" postfix="_posB"></emc-datagrid-column>
        <emc-datagrid-column name="remove" label="" type="button" width="50" text="" icon-type="font" icon="trash" tooltip="Remove" action="remove" fixed="end"></emc-datagrid-column>
    </emc-datagrid>
    <emc-form-row id="footer" align="end">
        <emc-button id="add" text="Add entry" icon-type="font" icon="add"></emc-button>
    </emc-form-row>
</div>
