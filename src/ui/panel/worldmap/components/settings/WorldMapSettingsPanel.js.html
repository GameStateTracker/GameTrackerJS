<div id="content">
    <emc-form-row>
        <emc-button id="reset-transform" text="Reset pan & zoom"></emc-button>
    </emc-form-row>
    <gt-worldmap-overview id="map-overview"></gt-worldmap-overview>
    <emc-form-field label="Zoom">
        <emc-input-slider id="zoom-slider" min="10" max="200" value="50" gradations></emc-input-slider>
    </emc-form-field>
    <emc-form-field label="Detailed maps">
        <emc-switch id="detailed-maps"></emc-switch>
    </emc-form-field>
    <emc-form-field label="Edge snap force">
        <emc-input-slider id="snap-slider" min="0" max="50" value="0" gradations></emc-input-slider>
    </emc-form-field>
</div>
<div id="icon"></div>
