<emc-form-container id="form">
    <form>
        <emc-input-string id="connection-token" name="connectionToken" label="Connection Token"></emc-input-string>
        <emc-form-row>
            <emc-button id="generate-token" text="generate token"></emc-button>
        </emc-form-row>
        <emc-input-string id="view-link" name="viewLink" label="View Link" readonly control-buttons="copy"></emc-input-string>
        <emc-input-switch id="auto-connect" name="autoConnect" label="Autoconnect on reload" value="true"></emc-input-switch>
    </form>
</emc-form-container>

<emc-button id="connect" text="connect"></emc-button>
<emc-button id="disconnect" text="disconnect" hidden></emc-button>
